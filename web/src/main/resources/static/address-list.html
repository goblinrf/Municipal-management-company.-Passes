<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список адресов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список адресов</h2>
        <button id="logoutBtn" class="btn btn-outline-danger">Выйти</button>
    </div>

    <button class="btn btn-primary mb-3" onclick="openCreateModal()" data-bs-toggle="modal" data-bs-target="#addressModal">
        Добавить адрес
    </button>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Улица</th>
            <th>Подъезд</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="addressList"></tbody>
    </table>
</div>

<!-- Модальное окно для добавления и редактирования -->
<div class="modal fade" id="addressModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="addressForm" class="modal-content">
            <div class="modal-header">
                <h5 id="modalTitle" class="modal-title">Добавить адрес</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="addressId">
                <div class="mb-3">
                    <label class="form-label">Улица</label>
                    <input type="text" id="street" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Подъезд</label>
                    <input type="number" id="entrance" class="form-control" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Скрипты -->
<script type="module">
    import { AddressPage } from './js/address-page.js';
    import { ListPage } from './js/list-page.js';

    const listPage = new ListPage("addressList");
    const page = new AddressPage(listPage);

    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("http://localhost:8081/logout", {
            method: "POST",
            credentials: 'include'
        });
        window.location.href = "/login.html";
    };

    try {
        await page.showAll();
    } catch (e) {
        if (e instanceof Response && (e.status === 401 || e.status === 403)) {
            window.location.href = "/login.html";
        } else {
            console.error("Ошибка при загрузке адресов:", e);
        }
    }
</script>
</body>
</html>
