<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список адресов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Список адресов</h2>
        <button id="logoutBtn" class="btn btn-outline-danger">Выйти</button>
    </div>

    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addAddressModal">
        Добавить адрес
    </button>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Улица</th>
            <th>Подъезд</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="addressTableBody"></tbody>
    </table>
</div>

<!-- Модалка: Добавить -->
<div class="modal fade" id="addAddressModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="addAddressForm" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить адрес</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Улица</label>
                    <input type="text" class="form-control" name="street" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Подъезд</label>
                    <input type="text" class="form-control" name="entrance" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- Модалка: Редактировать -->
<div class="modal fade" id="editAddressModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="editAddressForm" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать адрес</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="mb-3">
                    <label class="form-label">Улица</label>
                    <input type="text" class="form-control" name="street" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Подъезд</label>
                    <input type="text" class="form-control" name="entrance" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-success">Сохранить изменения</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    const addressTableBody = document.getElementById("addressTableBody");

    async function fetchAddresses() {
        try {
            const res = await fetch("http://localhost:8081/api/addresses", {
                credentials: 'include'
            });

            if (res.status === 401 || res.status === 403) {
                window.location.href = "/login.html";
                return;
            }

            if (!res.ok) {
                console.error("Ошибка при загрузке адресов:", res.status);
                return;
            }

            const data = await res.json();
            renderTable(data);
        } catch (e) {
            console.error("Ошибка при fetchAddresses:", e);
        }
    }

    function renderTable(addresses) {
        addressTableBody.innerHTML = "";
        addresses.forEach(addr => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${addr.id}</td>
                <td>${addr.street}</td>
                <td>${addr.entrance}</td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary me-2" onclick="openEditModal(${addr.id}, '${addr.street}', '${addr.entrance}')">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAddress(${addr.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            `;
            addressTableBody.appendChild(tr);
        });
    }

    window.openEditModal = function(id, street, entrance) {
        const form = document.getElementById("editAddressForm");
        form.id.value = id;
        form.street.value = street;
        form.entrance.value = entrance;
        new bootstrap.Modal(document.getElementById("editAddressModal")).show();
    }

    document.getElementById("addAddressForm").onsubmit = async function (e) {
        e.preventDefault();
        const body = {
            street: this.street.value,
            entrance: this.entrance.value
        };
        const res = await fetch("http://localhost:8081/api/addresses", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: 'include',
            body: JSON.stringify(body)
        });

        if (res.status === 401 || res.status === 403) {
            window.location.href = "/login.html";
            return;
        }

        bootstrap.Modal.getInstance(document.getElementById("addAddressModal")).hide();
        this.reset();
        fetchAddresses();
    };

    document.getElementById("editAddressForm").onsubmit = async function (e) {
        e.preventDefault();
        const id = this.id.value;
        const body = {
            street: this.street.value,
            entrance: this.entrance.value
        };
        const res = await fetch(`http://localhost:8081/api/addresses/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: 'include',
            body: JSON.stringify(body)
        });

        if (res.status === 401 || res.status === 403) {
            window.location.href = "/login.html";
            return;
        }

        bootstrap.Modal.getInstance(document.getElementById("editAddressModal")).hide();
        fetchAddresses();
    };

    window.deleteAddress = async function(id) {
        const res = await fetch(`http://localhost:8081/api/addresses/${id}`, {
            method: "DELETE",
            credentials: 'include'
        });

        if (res.status === 401 || res.status === 403) {
            window.location.href = "/login.html";
            return;
        }

        fetchAddresses();
    };

    document.getElementById("logoutBtn").onclick = async () => {
        await fetch("http://localhost:8081/logout", {
            method: "POST",
            credentials: 'include'
        });
        window.location.href = "/login.html";
    };

    fetchAddresses();
</script>
</body>
</html>
