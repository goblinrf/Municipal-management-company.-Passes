<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-4">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="card-title text-center mb-4">Вход</h4>
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Войти</button>
                        </div>
                        <div id="error-msg" class="text-danger mt-2 text-center" style="display:none;"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const response = await fetch('http://localhost:8081/login', {
            method: 'POST',
            credentials: 'include', // важно: сохраняет cookie сессии
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });

        if (response.ok) {
            window.location.href = '/address-list.html'; // перенаправление после входа
        } else {
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').textContent = 'Неверный логин или пароль';
        }
    });
</script>
</body>
</html>
